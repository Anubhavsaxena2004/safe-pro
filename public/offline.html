<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Kiddough</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; box-sizing: border-box; }
      .box { max-width: 360px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 18px; color: #64748b; }
      button { background: #0f766e; color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You're offline</h1>
      <p>Check your mobile data or Wi-Fi, then try again. Nothing you saved has been lost.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
